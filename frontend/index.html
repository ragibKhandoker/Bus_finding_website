<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf2ef" />
    <meta name="description" content="Plan your smarter commute around Dhaka." />
    <title>SmartCommute — Dhaka</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved colour theme before the page is drawn; with no saved choice, follow the device setting.
      try {
        var theme = localStorage.getItem('sc_theme')
        if (['light', 'dark', 'night'].indexOf(theme) < 0) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
    <style>
      /* Splash screen shown while the app loads. Kept inline so it appears before any script or stylesheet. */
      #splash{--sp-bg:#edf2ef;--sp-ink:#274038;--sp-muted:#6b7a71;--sp-green:#19865e;--sp-road:#d5e2dc;--sp-glow:#19865e2e;
        position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--sp-bg);
        background-image:radial-gradient(600px 380px at 50% 38%,var(--sp-glow),transparent 70%);
        font-family:"Manrope","DM Sans","Hind Siliguri",system-ui,sans-serif;transition:opacity .5s ease,visibility .5s}
      html[data-theme="dark"] #splash{--sp-bg:#1a1e1c;--sp-ink:#c6dcd5;--sp-muted:#9fa9a3;--sp-road:#2f3a35;--sp-glow:#19865e33}
      html[data-theme="night"] #splash{--sp-bg:#0d111e;--sp-ink:#d9cdb5;--sp-muted:#a8987a;--sp-road:#252c45;--sp-glow:#21725440}
      #splash.splash-hide{opacity:0;visibility:hidden}
      .sp-inner{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;text-align:center}
      .sp-scene{position:relative;width:min(280px,76vw);height:96px;overflow:hidden}
      .sp-bus{position:absolute;left:50%;bottom:18px;width:64px;height:64px;margin-left:-32px;border-radius:17px;
        filter:drop-shadow(0 10px 18px #19865e55);animation:sp-bounce .55s ease-in-out infinite alternate}
      .sp-road{position:absolute;left:0;right:0;bottom:8px;height:4px;border-radius:4px;background:var(--sp-road)}
      .sp-dash{position:absolute;left:0;bottom:9px;width:200%;height:2px;
        background:repeating-linear-gradient(90deg,var(--sp-green) 0 18px,transparent 18px 36px);opacity:.55;animation:sp-drive .7s linear infinite}
      .sp-pin{position:absolute;bottom:14px;width:10px;height:10px;border-radius:50%;border:3px solid var(--sp-green);background:var(--sp-bg)}
      .sp-pin.a{left:6px}.sp-pin.b{right:6px;border-color:#ed8570}
      .sp-title{margin:0;font-size:26px;font-weight:800;letter-spacing:-.8px;color:var(--sp-ink)}
      .sp-title span{color:var(--sp-green)}
      .sp-text{margin:-12px 0 0;font-size:14px;font-weight:500;color:var(--sp-muted);font-family:"DM Sans","Hind Siliguri",system-ui,sans-serif}
      .sp-bar{position:relative;width:170px;height:4px;border-radius:4px;background:var(--sp-road);overflow:hidden}
      .sp-bar:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:4px;
        background:linear-gradient(90deg,var(--sp-green),#2bb07d);animation:sp-load 1.1s ease-in-out infinite}
      @keyframes sp-bounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}
      @keyframes sp-drive{to{transform:translateX(-36px)}}
      @keyframes sp-load{to{left:100%}}
      @media(prefers-reduced-motion:reduce){.sp-bus,.sp-dash,.sp-bar:after{animation:none}.sp-bar:after{left:30%}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="sp-inner">
        <div class="sp-scene" aria-hidden="true">
          <span class="sp-pin a"></span><span class="sp-pin b"></span>
          <div class="sp-road"></div><div class="sp-dash"></div>
          <svg class="sp-bus" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="16" fill="#19865e"/>
            <rect x="14" y="10" width="36" height="40" rx="7" fill="#fff"/>
            <rect x="18" y="16" width="28" height="15" rx="2.5" fill="#19865e"/>
            <rect x="22" y="12.5" width="20" height="2" rx="1" fill="#19865e"/>
            <circle cx="22" cy="40" r="3" fill="#19865e"/><circle cx="42" cy="40" r="3" fill="#19865e"/>
            <rect x="17" y="49" width="7" height="6" rx="2" fill="#fff"/><rect x="40" y="49" width="7" height="6" rx="2" fill="#fff"/>
          </svg>
        </div>
        <p class="sp-title" id="sp-title">Smart<span>Commute</span></p>
        <p class="sp-text" id="sp-text">Getting your ride ready…</p>
        <div class="sp-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      // Show the splash text in Bangla when that is the saved language.
      try {
        if (localStorage.getItem('sc_lang') === 'bn') {
          document.getElementById('sp-title').innerHTML = 'স্মার্ট<span>কমিউট</span>'
          document.getElementById('sp-text').textContent = 'আপনার যাত্রা প্রস্তুত হচ্ছে…'
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
